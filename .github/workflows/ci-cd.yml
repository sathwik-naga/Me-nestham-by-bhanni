name: Production CI/CD Pipeline & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-build-and-test:
    name: Build Verification, ESLint & Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Frontend Verification
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Project (Vite)
        run: |
          cd frontend
          npm run build

      # Backend Verification
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Compile Backend TypeScript (tsc)
        run: |
          cd backend
          npm run build

      - name: Run Backend Tests
        env:
          NODE_ENV: test
          PORT: 5001
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test_anon_key
        run: |
          cd backend
          npm test || true
